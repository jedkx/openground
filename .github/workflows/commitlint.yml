name: Commit Lint

on:
  pull_request:
    branches:
      - master
      - development

jobs:
  commitlint:
    name: Check commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-action@v6
        with:
          configFile: .commitlintrc.yml
