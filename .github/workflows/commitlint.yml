name: Commit Lint

on:
  pull_request:
    branches:
      - master
      - development

jobs:
  commitlint:
    name: Check commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate conventional commits
        run: |
          pattern='^(feat|fix|docs|style|refactor|test|chore|ci|perf|revert)(\(.+\))?!?: .{1,100}$'
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          failed=0
          while IFS= read -r msg; do
            if ! echo "$msg" | grep -qP "$pattern"; then
              echo "::error::Invalid commit message: \"$msg\""
              failed=1
            fi
          done < <(git log "$base..$head" --format=%s)
          exit $failed
